<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f9">
  <title>网站盒子</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <path d="M3.3 7 12 12l8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>网站盒子</h1>
          <p><span id="totalCount">0</span> 个收藏</p>
        </div>
      </div>

      <div class="topbar-tools">
        <label class="search-box" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="搜索当前收藏" aria-label="搜索当前收藏">
          <button class="search-clear" id="searchClear" type="button" title="清空搜索" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
            </svg>
          </button>
        </label>
        <button class="icon-btn" type="button" id="importButton" title="导入备份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="m17 8-5-5-5 5"/>
            <path d="M12 3v12"/>
          </svg>
        </button>
        <button class="icon-btn" type="button" id="exportButton" title="导出备份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M12 15V3"/>
          </svg>
        </button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </header>

    <nav class="library-tabs" aria-label="收藏分类">
      <button class="tab is-active" type="button" data-section="websites">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </span>
        <span class="tab-label">网站收藏</span>
        <span class="tab-count" id="websitesCount">0</span>
      </button>
      <button class="tab" type="button" data-section="images">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
            <circle cx="9" cy="9" r="2"/>
            <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
          </svg>
        </span>
        <span class="tab-label">优美图片</span>
        <span class="tab-count" id="imagesCount">0</span>
      </button>
      <button class="tab" type="button" data-section="films">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M7 3v18"/>
            <path d="M3 7.5h4"/>
            <path d="M3 12h18"/>
            <path d="M3 16.5h4"/>
            <path d="M17 3v18"/>
            <path d="M17 7.5h4"/>
            <path d="M17 16.5h4"/>
          </svg>
        </span>
        <span class="tab-label">影视收藏</span>
        <span class="tab-count" id="filmsCount">0</span>
      </button>
    </nav>

    <main class="main-content">
      <section class="section-head" aria-labelledby="sectionTitle">
        <div>
          <h2 id="sectionTitle">网站收藏</h2>
          <p class="section-meta" id="sectionMeta">共 0 项</p>
        </div>
        <button class="btn btn-primary" id="addButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="M12 5v14"/>
          </svg>
          <span id="addButtonText">添加网站</span>
        </button>
      </section>

      <div class="filter-bar" id="filterBar" aria-label="分类筛选"></div>

      <div class="item-grid" id="itemGrid"></div>

      <section class="empty-state" id="emptyState" hidden>
        <div class="empty-art" aria-hidden="true">
          <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 30h48v42a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6z"/>
            <path d="M36 24V18a6 6 0 0 1 6-6h12a6 6 0 0 1 6 6v6"/>
            <path d="M36 46h24M36 58h16"/>
          </svg>
        </div>
        <h3 id="emptyTitle">还没有收藏</h3>
        <button class="btn" type="button" id="emptyAddButton">添加第一条</button>
        <button class="text-btn" type="button" id="emptyResetButton">载入示例数据</button>
      </section>
    </main>

    <footer class="app-footer">
      <span>数据保存在本机浏览器</span>
      <span id="updatedAt"></span>
    </footer>
  </div>

  <div class="overlay" id="modalOverlay" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div>
          <h3 id="modalTitle">添加收藏</h3>
          <p class="modal-sub" id="modalSub"></p>
        </div>
        <button class="icon-btn" type="button" data-close-modal title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </header>
      <form id="editForm">
        <div class="form-fields" id="formFields"></div>
        <footer class="modal-actions">
          <button class="btn" type="button" data-close-modal>取消</button>
          <button class="btn btn-primary" type="submit" id="saveButton">保存</button>
        </footer>
      </form>
    </section>
  </div>

  <div class="overlay lightbox" id="lightbox" hidden>
    <button class="lightbox-close icon-btn" type="button" data-close-lightbox title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
    </button>
    <figure class="lightbox-figure">
      <img id="lightboxImage" alt="" src="">
      <figcaption>
        <strong id="lightboxTitle"></strong>
        <span id="lightboxMeta"></span>
      </figcaption>
    </figure>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
